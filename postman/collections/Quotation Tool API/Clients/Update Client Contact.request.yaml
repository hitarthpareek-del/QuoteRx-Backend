$kind: http-request
name: Update Client Contact
order: 11000
method: PATCH
url: '{{baseUrl}}/api/clients/:clientId/contacts/:contactId'
pathVariables:
  - key: clientId
    value: client-id-here
  - key: contactId
    value: contact-id-here
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Jane Updated",
      "email": "jane.updated@clientcompany.com",
      "phone": "+9876543210",
      "designation": "Senior Procurement Manager"
    }
